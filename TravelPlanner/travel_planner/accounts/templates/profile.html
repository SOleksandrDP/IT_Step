{% extends "layout.html" %}
{% load static %}

{% block title %}
    Profile - TravelUkraine
{% endblock %}

{% block header %}
    <header class="site-header">
        <a href="/destinations" class="back-btn">←</a>
        <h1>Profile</h1>
        <a href="/" class="logo">TravelUkraine</a>
    </header>
{% endblock %}

{% block content %}
    <main id="profileContent">
        <div id="authForms">
            <div class="tabs">
                <button class="tab active" data-tab="login">Login</button>
                <button class="tab" data-tab="register">Register</button>
            </div>
            <div id="loginDiv" class="tab-content active">
                <form id="loginForm">
                    {% csrf_token %}
                    <input type="email" name="email" placeholder="Email" required>
                    <input type="password" name="password" placeholder="Password" required>
                    <input type="hidden" name="action" value="login">
                    <p id="loginError" class="error-message"></p>
                    <button type="submit">Sign In</button>
                </form>
            </div>
            <div id="registerDiv" class="tab-content">
                <form id="registerForm">
                    {% csrf_token %}
                    <input type="text" name="username" placeholder="Full Name" required>
                    <input type="email" name="email" placeholder="Email" required>
                    <input type="tel" name="phone" placeholder="Phone Number" required>
                    <input type="text" name="city" placeholder="City">
                    <input type="password" name="password" placeholder="Password" required>
                    <input type="password" name="confirmPassword" placeholder="Confirm Password" required>
                    <input type="hidden" name="action" value="register">
                    <p id="registerError" class="error-message"></p>
                    <button type="submit">Create Account</button>
                </form>
            </div>
        </div>
        <div id="userProfile" class="hidden">
            <!-- User profile content will be inserted here by JavaScript -->
        </div>
{% endblock %}
